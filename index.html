<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>普法知识答题 · 数据安全与合规专题</title>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
<style>
  :root{
    --navy:#0d2b5c; --navy-deep:#081d40; --navy-light:#16407f;
    --gold:#c9a227; --gold-light:#e6c455;
    --bg:#f4f6fa; --text:#222; --muted:#667;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
  }
  header{
    width:100%; background:linear-gradient(135deg,var(--navy-deep),var(--navy-light));
    padding:28px 16px 22px; text-align:center; color:#fff;
    border-bottom:4px solid var(--gold);
  }
  header .emblem{
    width:52px;height:52px;margin:0 auto 10px;border:2px solid var(--gold);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:24px;color:var(--gold);
  }
  header h1{font-size:20px;letter-spacing:2px;font-weight:600}
  header p{font-size:12px;color:#b9c6de;margin-top:6px;letter-spacing:1px}
  main{width:100%;max-width:560px;padding:20px 16px 40px;flex:1}
  .card{
    background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(13,43,92,.10);
    padding:24px 20px;border-top:3px solid var(--gold);
  }
  .btn{
    display:block;width:100%;padding:14px;margin-top:14px;border:none;border-radius:8px;
    font-size:16px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:.2s;
  }
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy-deep)}
  .btn-navy{background:var(--navy);color:#fff}
  .btn:active{transform:scale(.97)}
  .intro-line{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--muted);margin:10px 0;line-height:1.6}
  .intro-line::before{content:"◆";color:var(--gold);font-size:11px;margin-top:4px}
  /* 答题区 */
  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .progress{font-size:14px;color:var(--muted)}
  .progress b{color:var(--navy);font-size:18px}
  .timer{
    background:var(--navy);color:var(--gold-light);padding:6px 14px;border-radius:20px;
    font-size:15px;font-weight:700;letter-spacing:1px;min-width:76px;text-align:center;
  }
  .timer.warn{background:#a33;color:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.6}}
  .q-title{font-size:17px;font-weight:600;line-height:1.7;color:var(--navy-deep);margin-bottom:18px}
  .opt{
    display:flex;gap:10px;align-items:flex-start;border:1.5px solid #dde3ec;border-radius:8px;
    padding:13px 14px;margin-bottom:12px;font-size:15px;line-height:1.5;cursor:pointer;transition:.15s;background:#fbfcfe;
  }
  .opt .key{
    flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--navy);
    color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  }
  .opt.sel{border-color:var(--gold);background:#fdf8ea}
  .opt.sel .key{background:var(--gold);border-color:var(--gold);color:#fff}
  /* 结果 */
  .score-big{font-size:52px;font-weight:800;color:var(--navy);text-align:center;margin:10px 0 2px}
  .score-sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px}
  .review{border-top:1px dashed #ccd4e0;padding-top:14px;margin-top:8px}
  .review-item{margin-bottom:16px;font-size:14px;line-height:1.7}
  .review-item .rq{font-weight:600;color:var(--navy-deep)}
  .tag-ok{color:#1a7a3c;font-weight:700}
  .tag-bad{color:#b32;font-weight:700}
  .analysis{background:#f2f5fb;border-left:3px solid var(--gold);padding:8px 10px;border-radius:0 6px 6px 0;color:#445;font-size:13px;margin-top:6px}
  /* 排行榜 */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:var(--navy);color:#fff;padding:9px 6px;font-weight:600}
  td{padding:9px 6px;text-align:center;border-bottom:1px solid #e8ecf3}
  tr:nth-child(1) td{color:var(--gold);font-weight:800}
  tr:nth-child(2) td,tr:nth-child(3) td{font-weight:700;color:var(--navy)}
  .empty{text-align:center;color:var(--muted);padding:24px 0;font-size:14px}
  footer{width:100%;text-align:center;padding:14px;font-size:11px;color:#99a3b5;background:#eceff5}
  .name-input{
    width:100%;padding:13px;border:1.5px solid #dde3ec;border-radius:8px;font-size:15px;margin-top:10px;
  }
  .name-input:focus{outline:none;border-color:var(--gold)}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="emblem">⚖</div>
  <h1>普法知识答题</h1>
  <p>数据安全 · 个人信息保护 · 招标投标 专题测试</p>
</header>
<main>
  <!-- 首页 -->
  <div id="home" class="card">
    <div class="intro-line">题库共 20 道单选题，涵盖《数据安全法》《个人信息保护法》《招标投标法》。</div>
    <div class="intro-line">每次随机抽取 5 道题，每题 20 分，满分 100 分。</div>
    <div class="intro-line">每道题限时 60 秒，超时自动判错并进入下一题。</div>
    <input id="playerName" class="name-input" maxlength="10" placeholder="请输入您的姓名（用于排行榜）">
    <button class="btn btn-gold" onclick="startQuiz()">开始答题</button>
    <button class="btn btn-navy" onclick="showRank()">查看排行榜</button>
  </div>

  <!-- 答题 -->
  <div id="quiz" class="card hidden">
    <div class="quiz-top">
      <span class="progress">第 <b id="qNow">1</b> / 5 题</span>
      <span class="timer" id="timer">60s</span>
    </div>
    <div class="q-title" id="qTitle"></div>
    <div id="qOpts"></div>
    <button class="btn btn-gold" id="nextBtn" onclick="submitAnswer()">确认答案</button>
  </div>

  <!-- 结果 -->
  <div id="result" class="card hidden">
    <div class="score-big" id="scoreNum">0</div>
    <div class="score-sub" id="scoreMsg"></div>
    <div class="review" id="reviewList"></div>
    <button class="btn btn-gold" onclick="restart()">重新答题</button>
    <button class="btn btn-navy" onclick="showRank()">查看排行榜</button>
  </div>

  <!-- 排行榜 -->
  <div id="rank" class="card hidden">
    <h3 style="color:var(--navy);margin-bottom:12px;text-align:center;letter-spacing:2px">排 行 榜（前10名）</h3>
    <div id="rankBody"></div>
    <button class="btn btn-gold" onclick="restart()">重新答题</button>
    <button class="btn btn-navy" onclick="goHome()">返回首页</button>
  </div>
</main>
<footer>普法宣传教育 · 仅供内部学习使用</footer>

<script>
const BANK=[

 {q:"《数据安全法》自何时起施行？",opts:["2021年6月10日","2021年9月1日","2021年11月1日","2022年1月1日"],a:1,an:"《数据安全法》于2021年6月10日通过，自2021年9月1日起施行。"},

 {q:"根据《数据安全法》，重要数据的处理者应当按照规定对其数据处理活动定期开展风险评估，并向有关主管部门报送？",opts:["财务审计报告","风险评估报告","数据公开清单","年度报告"],a:1,an:"《数据安全法》第三十条规定，重要数据的处理者应当按照规定对其数据处理活动定期开展风险评估，并向有关主管部门报送风险评估报告。"},

 {q:"《个人信息保护法》自何时起施行？",opts:["2021年8月20日","2021年9月1日","2021年11月1日","2022年3月1日"],a:2,an:"《个人信息保护法》于2021年8月20日通过，自2021年11月1日起施行。"},
 {q:"根据《个人信息保护法》，处理个人信息应当遵循的基本原则不包括？",opts:["合法、正当、必要","诚信","公开透明","利益最大化"],a:3,an:"《个人信息保护法》第五至九条规定了合法、正当、必要、诚信、公开透明、目的明确、最小化等原则，不包括“利益最大化”。"},
 {q:"个人信息处理者在什么情况下可以处理个人信息？",opts:["任何情况下都可以","取得个人的同意（法定情形除外）","只要公司内部批准即可","只要不公开传播即可"],a:1,an:"《个人信息保护法》第十三条规定，处理个人信息一般应取得个人同意，法律、行政法规另有规定的情形除外。"},
 {q:"根据《个人信息保护法》，处理敏感个人信息应当取得个人的？",opts:["默示同意","单独同意","概括授权","无需同意"],a:1,an:"《个人信息保护法》第二十九条规定，处理敏感个人信息应当取得个人的单独同意；法律、行政法规规定应当取得书面同意的，从其规定。"},
 {q:"《个人信息保护法》规定，个人对其个人信息的处理享有知情权、决定权，有权（　）他人处理其个人信息？",opts:["限制或者拒绝","无条件配合","转让","出卖"],a:0,an:"《个人信息保护法》第四十四条规定，个人对其个人信息的处理享有知情权、决定权，有权限制或者拒绝他人对其个人信息进行处理。"},

 {q:"根据《个人信息保护法》，向境外提供个人信息应当具备的条件之一是？",opts:["无需任何条件","通过国家网信部门组织的安全评估等法定条件","只要对方公司承诺保密","只要数据不敏感"],a:1,an:"《个人信息保护法》第三十八条规定，向境外提供个人信息应具备通过安全评估、取得个人信息保护认证、订立标准合同等条件之一。"},

 {q:"根据《招标投标法》，依法必须进行招标的项目，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于？",opts:["十日","十五日","二十日","三十日"],a:2,an:"《招标投标法》第二十四条规定，依法必须进行招标的项目，自招标文件开始发出之日起至提交投标文件截止之日止，最短不得少于二十日。"},
 {q:"《招标投标法》规定，投标人不得相互串通投标报价，不得排挤其他投标人的公平竞争。串通投标的中标？",opts:["有效但需罚款","无效","经招标人同意后有效","可重新评审"],a:1,an:"《招标投标法》第三十二条禁止串通投标；第五十三条规定，投标人相互串通投标或者与招标人串通投标的，中标无效。"},
 {q:"依法必须进行招标的项目，其评标委员会成员人数为五人以上单数，其中技术、经济等方面的专家不得少于成员总数的？",opts:["二分之一","三分之一","三分之二","四分之三"],a:2,an:"《招标投标法》第三十七条规定，评标委员会由招标人代表和有关技术、经济等方面的专家组成，成员人数为五人以上单数，其中专家不得少于成员总数的三分之二。"},
 {q:"根据《招标投标法》，中标人确定后，招标人应当向中标人发出中标通知书，中标通知书对招标人和中标人具有？",opts:["参考效力","法律效力","建议效力","道德约束"],a:1,an:"《招标投标法》第四十五条规定，中标通知书对招标人和中标人具有法律效力。中标通知书发出后，招标人改变中标结果或中标人放弃中标项目的，应依法承担法律责任。"},
 {q:"《招标投标法》规定，招标人和中标人应当自中标通知书发出之日起多少日内，按照招标文件和中标人的投标文件订立书面合同？",opts:["十日","十五日","三十日","六十日"],a:2,an:"《招标投标法》第四十六条规定，招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。"},
 {q:"根据《招标投标法》，依法必须进行招标的项目，招标人违反规定与投标人就投标价格、投标方案等实质性内容进行谈判的，？",opts:["中标有效","中标无效","处以罚款后有效","需重新招标但中标有效"],a:1,an:"《招标投标法》第五十五条规定，依法必须进行招标的项目，招标人违反本法规定，与投标人就实质性内容进行谈判，影响中标结果的，中标无效。"}
];

const TOTAL=5, PER=20, LIMIT=60;
let questions=[], cur=0, answers=[], sel=-1, timerId=null, left=LIMIT, player="";

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){["home","quiz","result","rank"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden");window.scrollTo(0,0);}

function startQuiz(){
  const name=document.getElementById("playerName").value.trim();
  player=name||"匿名员工";
  questions=shuffle([...BANK]).slice(0,TOTAL);
  cur=0; answers=[];
  show("quiz"); renderQ();
}

function renderQ(){
  const q=questions[cur]; sel=-1;
  document.getElementById("qNow").textContent=cur+1;
  document.getElementById("qTitle").textContent=(cur+1)+". "+q.q;
  const box=document.getElementById("qOpts"); box.innerHTML="";
  const keys=["A","B","C","D"];
  q.opts.forEach((o,i)=>{
    const d=document.createElement("div"); d.className="opt";
    d.innerHTML='<span class="key">'+keys[i]+'</span><span>'+o+'</span>';
    d.onclick=()=>{sel=i;box.querySelectorAll(".opt").forEach(e=>e.classList.remove("sel"));d.classList.add("sel");};
    box.appendChild(d);
  });
  document.getElementById("nextBtn").textContent=(cur===TOTAL-1)?"提交答卷":"确认并下一题";
  startTimer();
}

function startTimer(){
  clearInterval(timerId); left=LIMIT;
  const t=document.getElementById("timer"); t.textContent=left+"s"; t.classList.remove("warn");
  timerId=setInterval(()=>{
    left--; t.textContent=left+"s";
    if(left<=10)t.classList.add("warn");
    if(left<=0){submitAnswer(true);}
  },1000);
}

function submitAnswer(timeout){
  clearInterval(timerId);
  if(!timeout&&sel<0){alert("请先选择一个选项");startTimer();return;}
  answers.push(timeout?-1:sel);
  cur++;
  if(cur<TOTAL){renderQ();}else{finish();}
}

async function finish(){
  let score=0;
  answers.forEach((a,i)=>{if(a===questions[i].a)score+=PER;});
  document.getElementById("scoreNum").textContent=score;
  document.getElementById("scoreMsg").textContent=
    player+"，您答对 "+(score/PER)+" / "+TOTAL+" 题 ｜ "+(score===100?"满分！表现优秀 🎉":score>=80?"成绩良好，继续加油":score>=60?"刚好及格，建议复习法规":"建议重新学习后再来挑战");
  const keys=["A","B","C","D"];
  let html="";
  questions.forEach((q,i)=>{
    const a=answers[i], ok=a===q.a;
    html+='<div class="review-item"><div class="rq">'+(i+1)+'. '+q.q+'</div>'
      +'<div>您的答案：<span class="'+(ok?"tag-ok":"tag-bad")+'">'+(a>=0?keys[a]:"未作答（超时）")+'</span>'
      +'　正确答案：<span class="tag-ok">'+keys[q.a]+'</span></div>'
      +'<div class="analysis">解析：'+q.an+'</div></div>';
  });
  document.getElementById("reviewList").innerHTML=html;
  await saveScore(player,score);
  show("result");
}

/* ---- 云端共用排行榜（腾讯云开发 CloudBase · PostgreSQL + RLS）----
   Publishable Key 为客户端公钥（仅能访问 RLS 放行的公开资源），可安全放在前端。
   云端不可用时自动降级为本地 localStorage 排行榜。 */

let cloudDb=null,cloudReady=null;

function initCloud(){
  if(!cloudReady){
    cloudReady=(async()=>{
      try{
        const app=cloudbase.init({env:CLOUD_ENV,region:CLOUD_REGION,accessKey:CLOUD_PUBLISHABLE_KEY});
        const r=await app.auth.signInAnonymously();
        if(r&&r.error)throw r.error;
        cloudDb=app.rdb();
        return true;
      }catch(e){
        cloudReady=null;
        console.warn("云端排行榜连接失败，降级为本地排行榜",e);
        return false;
      }
    })();
  }
  return cloudReady;
}

function saveLocal(name,score){
  let arr=[];
  try{arr=JSON.parse(localStorage.getItem("lawQuizRank")||"[]");}catch(e){}
  arr.push({name:name,score:score,time:Date.now()});
  arr.sort((a,b)=>b.score-a.score||a.time-b.time);
  localStorage.setItem("lawQuizRank",JSON.stringify(arr.slice(0,50)));
}

async function saveScore(name,score){
  if(await initCloud().catch(()=>false)){
    try{
      const {error}=await cloudDb.from("quiz_scores").insert({name:name,score:score});
      if(!error)return;
    }catch(e){console.warn("云端成绩写入失败",e);}
  }
  saveLocal(name,score);
}

async function showRank(){
  show("rank");
  const body=document.getElementById("rankBody");
  body.innerHTML='<div class="empty">正在加载排行榜…</div>';
  let rows=null,fromCloud=false;
  if(await initCloud().catch(()=>false)){
    try{
      const {data,error}=await cloudDb.from("quiz_scores")
        .select("name,score,created_at")
        .order("score",{ascending:false})
        .order("created_at",{ascending:true})
        .limit(50);
      if(!error&&Array.isArray(data)){rows=data;fromCloud=true;}
    }catch(e){console.warn("云端排行榜读取失败",e);}
  }
  if(!rows){
    try{rows=JSON.parse(localStorage.getItem("lawQuizRank")||"[]");}catch(e){rows=[];}
  }
  if(!rows.length){body.innerHTML='<div class="empty">暂无成绩记录，快来第一个答题吧！</div>';}
  else{
    let html="<table><tr><th>名次</th><th>姓名</th><th>得分</th><th>日期</th></tr>";
    rows.slice(0,10).forEach((r,i)=>{
      const d=new Date(fromCloud?r.created_at:r.time);
      html+="<tr><td>"+(i+1)+"</td><td>"+escapeHtml(r.name)+"</td><td>"+r.score+"</td><td>"+(d.getMonth()+1)+"-"+d.getDate()+"</td></tr>";
    });
    body.innerHTML=html+"</table>";
  }
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
